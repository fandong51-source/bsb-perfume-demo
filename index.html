<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- renderer ---------- */
const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.28;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);

/* ---------- environment: warm studio HDRI ---------- */
function makeStudioEnvironment() {
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x1a0c04);

  const panel = (color, intensity, w, h, pos, lookAt = [0, 0, 0]) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide })
    );
    m.position.set(...pos);
    m.lookAt(...lookAt);
    envScene.add(m);
  };

  // key softbox — big warm light, upper-left front (as in the reference photo)
  panel(0xfff1dc, 14, 6, 8, [-5, 7, 6]);
  // warm rim/back lights to create the amber edge highlights on the glass
  panel(0xff9a3c, 10, 5, 5, [6, 3, -6]);
  panel(0xff7a1a, 6, 4, 6, [-6, -2, -5]);
  // low fill so the shadow side is not pure black
  panel(0x8a4a20, 1.6, 10, 4, [0, -7, 4]);
  // small hot strip on top for the crisp cap highlight
  panel(0xfff6ea, 20, 1.2, 6, [2, 8, 1], [0, 0, 0]);
  // tall softbox on the left — the long soft streak reflected in the glass
  panel(0xffe2b8, 7, 1.6, 8, [-4, 0.5, 7], [0, 0, 0]);
  // second, softer strip on the right for the thin edge highlight
  panel(0xffc98a, 4, 0.9, 6, [4.5, 1, 5], [0, 0, 0]);

  const pmrem = new THREE.PMREMGenerator(renderer);
  const tex = pmrem.fromScene(envScene, 0.09).texture;
  pmrem.dispose();
  return tex;
}
scene.environment = makeStudioEnvironment();

/* ---------- warm backdrop with bokeh (follows the camera) ---------- */
function makeBackdropTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const g = c.getContext('2d');

  // base warm brown gradient — deliberately darker at the center (behind the
  // bottle) so the glass has contrast to refract against; glow lives at the edges
  const grad = g.createRadialGradient(400, 330, 80, 512, 512, 900);
  grad.addColorStop(0, '#7a3d12');
  grad.addColorStop(0.4, '#5a2c0b');
  grad.addColorStop(0.75, '#381a06');
  grad.addColorStop(1, '#1f0d03');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 1024);

  // soft bokeh blobs
  const blob = (x, y, r, rgb, a) => {
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(${rgb},${a})`);
    rg.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = rg;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  };
  blob(150, 150, 200, '255,190,110', 0.55);   // top-left glow
  blob(880, 820, 260, '255,170,80', 0.35);    // bottom-right glow
  blob(850, 120, 120, '255,220,160', 0.35);
  blob(80, 750, 150, '255,150,60', 0.30);
  blob(520, 880, 180, '255,190,120', 0.22);
  blob(950, 450, 100, '255,210,150', 0.25);
  // light source behind the bottle, slightly upper-left of center — bright enough
  // that the dip tube silhouettes against it through the glass (like the photo),
  // while still falling off toward the right edge and the base
  blob(440, 300, 230, '255,198,115', 0.70);   // main back-light behind the bottle
  blob(600, 700, 300, '255,150,70', 0.18);    // faint spill toward lower-right
  // gentle vertical falloff toward the base
  const vg = g.createLinearGradient(0, 80, 0, 900);
  vg.addColorStop(0, 'rgba(255,180,100,0.12)');
  vg.addColorStop(0.55, 'rgba(80,40,12,0.04)');
  vg.addColorStop(1, 'rgba(16,6,2,0.40)');
  g.fillStyle = vg;
  g.fillRect(0, 0, 1024, 1024);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const backdrop = new THREE.Group();
{
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(34, 22),
    new THREE.MeshBasicMaterial({ map: makeBackdropTexture(), depthWrite: false, fog: false })
  );
  plane.position.set(0, 1, 0);
  backdrop.add(plane);

  // out-of-focus light dots floating in front of the backdrop (parallax depth)
  const dot = (x, y, z, r, color, opacity) => {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    rg.addColorStop(0, 'rgba(255,255,255,1)');
    rg.addColorStop(0.55, 'rgba(255,255,255,0.45)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(c);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, color, transparent: true, opacity,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    s.position.set(x, y, z);
    s.scale.setScalar(r);
    backdrop.add(s);
  };
  dot(-5.5, 3.2, 6, 3.4, 0xffc27a, 0.30);   // big warm glow, upper left
  dot(6.2, -2.6, 7, 4.2, 0xffa653, 0.25);   // lower right
  dot(4.8, 3.8, 8, 1.6, 0xffe0b0, 0.35);
  dot(-4.2, -3.4, 7.5, 1.2, 0xffb066, 0.30);
  dot(0.5, 4.6, 9, 1.0, 0xffd9a8, 0.28);
  // soft warm fill right behind the bottle — subtle, so the glass keeps contrast
  dot(0, 0.4, 9.5, 5.0, 0xffa653, 0.06);
}
scene.add(backdrop);

/* ---------- lights (env does most of the work; these add sparkle) ---------- */
const key = new THREE.SpotLight(0xffe6c4, 60, 0, Math.PI / 5, 0.5, 1.6);
key.position.set(-4, 6, 5);
scene.add(key);

const rim = new THREE.SpotLight(0xff8a2a, 50, 0, Math.PI / 4, 0.7, 1.6);
rim.position.set(5, 2.5, -4);
scene.add(rim);

scene.add(new THREE.AmbientLight(0x40200c, 1.2));

/* ---------- load model & rebuild materials ---------- */
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 2.2;
controls.maxDistance = 8;

/* ---------- embossed shoulder lettering (bump map) ----------
   The reference bottle has a faint raised "◆ BROWN SUGAR BASE ◆" arc on the
   shoulder, following the curve of the glass. The GLB contains neither the
   geometry nor a texture for it, so it is recreated here as a bump map
   (mid-gray = flat surface, bright = raised), with each glyph placed along
   an arc so it wraps the shoulder like the real embossing. */
function makeEmbossBump() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#808080';
  g.fillRect(0, 0, 1024, 1024);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = '700 42px Georgia, "Times New Roman", serif';

  const TEXT = '◆ BROWN SUGAR BASE ◆';
  const cx = 512, cy = 560, R = 400;  // arc center below: text tops out at y=160 (shoulder)
  const span = Math.PI * 0.42;        // total arc (~76°) — matches the shoulder sweep
  const n = TEXT.length;
  const draw = (fill, ox, oy) => {
    g.fillStyle = fill;
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1);
      const a = -Math.PI / 2 + (t - 0.5) * span;
      g.save();
      g.translate(cx + Math.cos(a) * R + ox, cy + Math.sin(a) * R + oy);
      g.rotate(a + Math.PI / 2);      // align glyph with the arc tangent
      g.fillText(TEXT[i], 0, 0);
      g.restore();
    }
  };
  draw('rgba(70,70,70,0.9)', 1.5, 2.5); // shaded lower edge — sells the relief
  draw('#c8c8c8', 0, 0);                // raised face

  const tex = new THREE.CanvasTexture(c);
  tex.flipY = false; // glTF UV convention
  return tex;
}

new GLTFLoader().load(GLB_URI, (gltf) => {
  const model = gltf.scene;

  const GOLD = new THREE.Color(0.83, 0.64, 0.29);
  const AMBER = new THREE.Color(1.0, 0.66, 0.14);

  model.traverse((obj) => {
    if (!obj.isMesh) return;
    const name = (obj.material?.name || '');

    if (name.includes('Bottle body')) {
      if (new URLSearchParams(location.search).has('hideglass')) { obj.visible = false; return; }
      // Clear amber glass. The dark baked baseColor texture is dropped entirely —
      // tint comes only from volume absorption, so the background stays visible
      // THROUGH the bottle (that contrast is what makes glass read as glass).
      obj.material = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0,
        roughness: 0.05,
        transmission: 1.0,
        // keep this small: three.js scales the screen-space refraction offset by
        // thickness, so a big value bends the tube seen through the front glass
        // even at near-flat angles (which reads as "wrong refraction")
        thickness: 0.02,
        ior: 1.5,
        attenuationColor: AMBER,
        // absorption per unit length kept constant (0.08/0.78 ≈ 0.02/0.2)
        attenuationDistance: 0.2,
        // the GLB has no embossed-logo geometry, so the shoulder lettering from
        // the reference is faked with a bump map (gray = flat, raised text)
        bumpMap: makeEmbossBump(),
        bumpScale: 1.0,
        clearcoat: 0.15,
        clearcoatRoughness: 0.08,
        envMapIntensity: 1.5,
        specularIntensity: 1.0,
        side: THREE.FrontSide,
      });
    } else if (name.includes('Cap') || name.includes('Nozzle')) {
      // polished champagne gold
      obj.material = new THREE.MeshPhysicalMaterial({
        color: GOLD,
        metalness: 1.0,
        roughness: 0.16,
        clearcoat: 0.3,
        clearcoatRoughness: 0.1,
        envMapIntensity: 1.4,
      });
    } else if (name.includes('tube')) {
      // inner dip tube — must be OPAQUE: transmissive objects don't show through
      // the bottle's transmission pass, so an opaque tube is what makes it visible
      // inside the glass. Gently thickened (any more and the curved tail pokes
      // through the glass wall), dark warm brown with a bit of diffuse shading.
      // The tube sits far left inside the model (near the glass edge where the
      // dark rim hides it), so nudge it toward the center where it silhouettes
      // against the bright interior, like the reference photo.
      obj.scale.x *= 2.0;
      obj.scale.z *= 2.0;
      obj.position.x += 0.006;
      obj.material = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0.07, 0.035, 0.008),
        metalness: 0,
        roughness: 0.55,
        envMapIntensity: 0.6,
      });
    }
    // logo: keep original material, just polish it a bit
    if (name.includes('logo')) {
      obj.material.metalness = 0.1;
      obj.material.roughness = 0.3;
      obj.material.envMapIntensity = 1.1;
    }
  });

  // normalize scale & center
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const targetHeight = 2.6;
  const s = targetHeight / size.y;
  model.scale.setScalar(s);
  model.position.sub(center.multiplyScalar(s));
  scene.add(model);

  controls.target.set(0, 0, 0);
  camera.position.set(0.6, 0.35, 4.4);
  controls.update();

  document.getElementById('loading').classList.add('done');
}, undefined, (err) => {
  document.getElementById('loading').textContent = '模型加载失败：' + err;
});

/* ---------- post-processing: subtle bloom for the glass highlights ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight), 0.28, 0.7, 0.82
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- loop / resize ---------- */
const camDir = new THREE.Vector3();
function tick() {
  requestAnimationFrame(tick);
  controls.update();
  // keep the backdrop behind the bottle, roughly facing the camera
  camDir.copy(camera.position).sub(controls.target);
  backdrop.position.copy(controls.target).addScaledVector(camDir.normalize(), -12);
  backdrop.lookAt(camera.position);
  composer.render();
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
